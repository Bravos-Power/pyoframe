# This workflow runs the tests.
# It is triggered automatically on pull requests and is also run weekly on the main branch.
# Tests are run in a matrix of different Python versions.
# This test also uploads coverage results to Codecov.

# Note: We use the insecure pull_request_target to allow running workflows from forks.
# However, we've added checks (see below) for safety.
# In short, the 'safe to test' label must exist AND the workflow must be run by someone with write access.
# See more details here:
#   - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#   - https://michaelheap.com/access-secrets-from-forks/
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  pull_request_target:
    branches: ["*"]
  schedule:
    - cron: "0 5 * * WED"
  workflow_dispatch:

jobs:
  check_permissions:
    runs-on: ubuntu-latest
    steps:
      # Important checks to ensure that the user has the required permissions. See note above.
      # Step 1: If user has current permissions we're good!
      - name: Get User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Otherwise, get triggering user's permissions
      - name: Get Triggering User Permission
        if: steps.checkAccess.outputs.require-result == 'false'
        id: checkTriggeringAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # If neither has permissions and no 'safe to test' label and not dependabot throw error
      - name: Check User Permission
        if: steps.checkAccess.outputs.require-result == 'false' && steps.checkTriggeringAccess.outputs.require-result == 'false' && !contains(github.event.pull_request.labels.*.name, 'safe to test') && (github.actor != 'dependabot[bot]')
        shell: bash
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          echo "Re-run the test yourself if you have write permissions. Alternatively, add the label 'safe to test' to the PR to give the user write permissions (only if you trust them)."
          exit 1
  run:
    if: |
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || 
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || 
      (github.event_name != 'pull_request_target' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    needs: check_permissions
    continue-on-error: ${{ !matrix.latest }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
        latest: [true]
        include:
          - python-version: "3.10"
            latest: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Setup optimizers
        uses: ./.github/actions/setup_optimizers_linux
        with:
          GUROBI_WLS: ${{ secrets.GUROBI_WLS }}
          COPT_LICENSE_KEY: ${{ secrets.COPT_LICENSE_KEY }}
          COPT_LICENSE_DAT: ${{ secrets.COPT_LICENSE_DAT }}
          MOSEK_LICENSE: ${{ secrets.MOSEK_LIC_FILE }}
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Test MOSEK Python binding
        if: ${{ env.MOSEK_10_2_BINDIR != '' }}
        run: |
          python - <<'PY'
          import ctypes
          import os
          import subprocess
          from pathlib import Path

          import pyoframe as pf
          import pyoptinterface._src.mosek as poi_mosek
          from pyoptinterface._src.mosek_model_ext import (
              is_library_loaded,
              load_library,
          )

          bindir = Path(os.environ["MOSEK_10_2_BINDIR"])
          libraries = sorted(bindir.glob("libmosek64.so*"))
          print(f"MOSEK shared libraries in {bindir}: {libraries}")
          if not libraries:
              raise FileNotFoundError(f"No MOSEK shared library found in {bindir}")

          library = next(
              (path for path in libraries if path.name == "libmosek64.so"),
              libraries[0],
          )
          ldd = subprocess.run(
              ["ldd", "-r", str(library)], capture_output=True, text=True
          )
          ldd_output = ldd.stdout + ldd.stderr
          print(f"ldd -r {library}:\n{ldd_output}")
          if (
              ldd.returncode
              or "not found" in ldd_output
              or "undefined symbol" in ldd_output
          ):
              raise RuntimeError("MOSEK shared-library dependencies did not resolve")

          ctypes.CDLL(str(library))
          print(f"ctypes loaded {library}")

          candidates = poi_mosek.detected_libraries()
          print(f"PyOptInterface library candidates: {candidates}")
          if not is_library_loaded():
              for candidate in candidates:
                  loaded = load_library(candidate)
                  print(f"PyOptInterface load_library({candidate!r}): {loaded}")
                  if is_library_loaded():
                      break
          if not is_library_loaded():
              raise RuntimeError("PyOptInterface could not load the MOSEK library")

          model = pf.Model("mosek")
          model.X = pf.Variable(lb=1)
          model.minimize = model.X
          model.optimize()
          assert abs(model.X.solution - 1) < 1e-4
          print("Pyoframe solved the MOSEK smoke-test model")
          PY
      - name: Install GDB
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Run tests and collect coverage  # quit $_exitcode passes through the pytest exit code
        run: |
          gdb -batch \
            -ex "set print thread-events off" \
            -ex run \
            -ex "thread apply all bt full" \
            -ex 'quit $_exitcode' \
            --args python -m pytest --cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          flags: smart-tests
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
